name: Reusable Build

on:
  workflow_call:
    inputs:
      php-version:
        required: true
        type: string
      artifact-name:
        required: true
        type: string

jobs:
  build:
    runs-on: [self-hosted]
    permissions:
      contents: read

    env:
      WP_ENV_PORT: 8889
      # Must live on the shared work emptyDir mounted by ARC's dind containerMode
      # so the dind sidecar can resolve the bind-mount source paths wp-env generates.
      WP_ENV_HOME: /home/runner/_work/_temp/wp-env-home

    timeout-minutes: 30

    steps:
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2 # v2.3.0
        with:
          version: latest
          cache-binary: true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}

      - name: Configure Git for Safe Directory
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0
        with:
          composer-options: '--no-dev --optimize-autoloader'

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Install npm dependencies
        run: npm ci

      - name: Build plugin for release
        run: npm run build:prod

      - name: Pin plugin folder name in wp-env config
        run: |
          jq --arg path "$(pwd)" \
             'del(.plugins) | .mappings["wp-content/plugins/plugin-skeleton-d"] = $path' \
             .wp-env.json > .wp-env.json.tmp && mv .wp-env.json.tmp .wp-env.json
          cat .wp-env.json

      - name: Start the Docker testing environment
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm run wp-env start -- --update

      - name: Generate Translation files
        run: npm run i18n:make-pot

      - name: Create plugin zip
        run: npm run plugin-zip

      - name: Upload plugin zip artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: plugin-skeleton-d.zip
          if-no-files-found: error

      - name: Stop the Docker testing environment
        if: always()
        run: npm run wp-env destroy -- --force
