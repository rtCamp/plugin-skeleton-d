name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Prepare release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    permissions:
      contents: read
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/reusable-build-public.yml
    # uses: rtCamp/plugin-skeleton-d/.github/workflows/reusable-build-public.yml@<version> # Use this in downstream repositories.
    with:
      php-version: '8.2'
      plugin-slug: plugin-skeleton-d
      artifact-name: plugin-skeleton-d
      ref: ${{ needs.release-please.outputs.tag_name }}

  upload:
    name: Upload release asset
    needs: [release-please, build]
    permissions:
      contents: write
    uses: rtCamp/wp-shared-workflows/.github/workflows/cd-github-release.yml@6a4d945cc07377a6ce02ae4831a9817fe629d5b1 # v1.1.1
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      artifact-name: plugin-skeleton-d
