name: Run JS Lint

on:
  workflow_call:
    inputs:
      eslint:
        description: 'Run ESLint check'
        required: false
        type: boolean
        default: true
      tsc:
        description: 'Run TypeScript check'
        required: false
        type: boolean
        default: true
      stylelint:
        description: 'Run Stylelint check'
        required: false
        type: boolean
        default: true
      prettier:
        description: 'Run Prettier check'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  lint-js:
    name: JS Lint & TypeScript
    runs-on: [self-hosted]
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}

      - name: Configure Git for Safe Directory
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Install npm dependencies
        id: npm-ci
        run: npm ci

      # Each check runs even when an earlier one fails, so every failure is reported in one run.
      - name: Run ESLint
        id: eslint
        if: ${{ inputs.eslint && !cancelled() && steps.npm-ci.outcome == 'success' }}
        run: npm run lint:js

      - name: Run TypeScript check
        id: typescript
        if: ${{ inputs.tsc && !cancelled() && steps.npm-ci.outcome == 'success' }}
        run: npm run lint:js:types

      - name: Run Stylelint
        id: stylelint
        if: ${{ inputs.stylelint && !cancelled() && steps.npm-ci.outcome == 'success' }}
        run: npm run lint:css

      - name: Run Prettier check
        id: prettier
        if: ${{ inputs.prettier && !cancelled() && steps.npm-ci.outcome == 'success' }}
        run: npm run format -- --check
