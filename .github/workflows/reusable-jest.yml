name: Run Jest Tests

on:
  workflow_call:
    inputs:
      coverage:
        description: 'Enable code coverage'
        required: false
        type: boolean
        default: true

    secrets:
      CODECOV_TOKEN:
        description: 'Codecov upload token'
        required: false

permissions:
  contents: read

jobs:
  jest:
    name: Jest Unit Tests${{ inputs.coverage && ' with coverage' || '' }}
    runs-on: [self-hosted]
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}

      - name: Configure Git for Safe Directory
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      # Keyed on the lockfile, so the cache is refreshed whenever dependencies change.
      - name: Cache Jest transforms
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.jest-cache
          key: jest-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            jest-${{ runner.os }}-

      - name: Install npm dependencies
        run: npm ci

      - name: Run Jest tests${{ inputs.coverage && ' with coverage' || '' }}
        run: npm run test:js${{ inputs.coverage && ':coverage' || '' }} -- --ci --cacheDirectory="$HOME/.jest-cache"

      - name: Upload code coverage report to Codecov
        if: ${{ inputs.coverage }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: tests/_output/js-coverage/lcov.info
          flags: jest
          fail_ci_if_error: false

      - name: Upload HTML coverage report as artifact
        if: ${{ inputs.coverage }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jest-code-coverage
          path: tests/_output/js-coverage/lcov-report
          retention-days: 7
          if-no-files-found: ignore
