name: PR Cleanup

# Deletes a closed PR's Actions artifacts. Unlike the public variant, there are no Playground preview zips to delete.
#
# Callers usually trigger this on `pull_request_target` (closed), so fork PRs get a token that can delete.
# It must never check out, build, or run PR code.
on:
  workflow_call:
    inputs:
      pr-number:
        description: 'Number of the closed pull request'
        required: true
        type: number
      head-ref:
        description: 'Head branch of the pull request'
        required: true
        type: string
      head-repo-id:
        description: 'ID of the head repository. Empty (e.g. a deleted fork) skips deleting Actions artifacts.'
        required: false
        type: string
        default: ''
      release-tag:
        description: 'Unused here; accepted so callers can switch to the public variant unchanged.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  cleanup:
    name: Delete PR Artifacts
    runs-on: [self-hosted]
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write

    steps:
      - name: Delete Actions artifacts from PR runs
        if: inputs.head-repo-id != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_REF: ${{ inputs.head-ref }}
          HEAD_REPO_ID: ${{ inputs.head-repo-id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const headRepoId = Number(process.env.HEAD_REPO_ID);

            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner,
              repo,
              event: 'pull_request',
              branch: process.env.HEAD_REF,
              per_page: 100,
            });

            // Match the head repository too, so a fork branch with the same name is left alone.
            for (const run of runs.filter((r) => r.head_repository?.id === headRepoId)) {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner,
                repo,
                run_id: run.id,
                per_page: 100,
              });

              for (const artifact of artifacts.filter((a) => !a.expired)) {
                core.info(`Deleting artifact ${artifact.name} from run ${run.id}`);
                await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
              }
            }
