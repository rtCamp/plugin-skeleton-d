name: WordPress Playground PR Preview

# Publishes the Playground preview bundle uploaded by `reusable-build*.yml` (`playground-preview: true`) and posts the
# Preview button to the PR. Must be called from a `workflow_run` trigger. Public repositories only.
on:
  workflow_call:
    inputs:
      plugin-slug:
        description: 'Plugin slug, matching the `plugin-slug` passed to reusable-build-public.yml'
        required: true
        type: string
      blueprint-path:
        description: 'Path to the Blueprint whose installPlugin step should install the PR build'
        required: false
        type: string
        default: 'blueprint.json'
      artifacts-to-keep:
        description: 'Number of commits worth of preview zips to keep per PR, or `keep-all`'
        required: false
        type: string
        default: '2'

permissions: {}

jobs:
  blueprint:
    name: Prepare Blueprint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      blueprint: ${{ steps.blueprint.outputs.blueprint }}
    steps:
      # In a `workflow_run`, this checks out the caller's default branch, never the PR code.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: ${{ inputs.blueprint-path }}
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Point blueprint.json at the PR build
        id: blueprint
        run: |
          BLUEPRINT=$(jq -c --arg url "{{ARTIFACT_URL:${PLUGIN_SLUG}}}" '(.steps[] | select(.step == "installPlugin") | .pluginData.url) = $url' "$BLUEPRINT_PATH")
          echo "blueprint=$BLUEPRINT" >> "$GITHUB_OUTPUT"
        env:
          PLUGIN_SLUG: ${{ inputs.plugin-slug }}
          BLUEPRINT_PATH: ${{ inputs.blueprint-path }}

  publish:
    name: Publish Preview
    needs: blueprint
    permissions:
      contents: write
      pull-requests: write
    uses: WordPress/action-wp-playground-pr-preview/.github/workflows/preview-publish.yml@1b15093d61b5e98cdfeb31466f34ade495762cd7 # v4.0.0
    with:
      blueprint: ${{ needs.blueprint.outputs.blueprint }}
      artifacts-to-keep: ${{ inputs.artifacts-to-keep }}
