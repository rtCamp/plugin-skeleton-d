name: Reusable Build

on:
  workflow_call:
    inputs:
      php-version:
        description: 'PHP version to use'
        required: true
        type: string
      plugin-slug:
        description: 'Plugin slug (directory name and text domain), e.g. my-plugin'
        required: true
        type: string
      artifact-name:
        description: 'Name of the uploaded artifact'
        required: true
        type: string
      artifact-path:
        description: 'Path of the file to upload as the artifact. Defaults to `<plugin-slug>.zip`.'
        required: false
        type: string
        default: ''
      ref:
        description: 'Git ref to build. Empty builds the commit that triggered the workflow.'
        required: false
        type: string
        default: ''
      playground-preview:
        description: 'Also upload the zip as a WordPress Playground PR preview bundle (pull_request events only).'
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0
        with:
          composer-options: '--no-dev --optimize-autoloader'

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build plugin for release
        run: npm run build:prod

      - name: Start the Docker testing environment
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm run wp-env start

      - name: Generate Translation files
        run: npm run i18n:make-pot

      - name: Create plugin zip
        run: npm run plugin-zip

      - name: Upload plugin zip artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path || format('{0}.zip', inputs.plugin-slug) }}
          if-no-files-found: error

      # Matches the bundle layout of WordPress/action-wp-playground-pr-preview's preview-build.yml (v4),
      # which is consumed by reusable-wp-playground-pr-preview-public.yml.
      - name: Stage Playground preview bundle
        if: inputs.playground-preview && github.event_name == 'pull_request'
        run: |
          mkdir -p wp-playground-preview-bundle/zips
          cp "$ARTIFACT_PATH" "wp-playground-preview-bundle/zips/${PLUGIN_SLUG}.zip"
        env:
          ARTIFACT_PATH: ${{ inputs.artifact-path || format('{0}.zip', inputs.plugin-slug) }}
          PLUGIN_SLUG: ${{ inputs.plugin-slug }}

      - name: Upload Playground preview bundle
        if: inputs.playground-preview && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wp-playground-preview-pr${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: wp-playground-preview-bundle/
          if-no-files-found: error
          # Only needed until reusable-wp-playground-pr-preview-public.yml publishes it.
          retention-days: 7
