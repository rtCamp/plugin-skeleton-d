name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - release/**
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: read
    outputs:
      actionlint: ${{ steps.filter.outputs.actionlint }}
      php: ${{ steps.filter.outputs.php }}
      phpcs: ${{ steps.filter.outputs.phpcs }}
      phpstan: ${{ steps.filter.outputs.phpstan }}
      phpunit: ${{ steps.filter.outputs.phpunit }}
      js: ${{ steps.filter.outputs.js }}
      css: ${{ steps.filter.outputs.css }}
      e2e: ${{ steps.filter.outputs.e2e }}
      jest: ${{ steps.filter.outputs.jest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Omit this or set it to true if later steps in this job need authenticated git operations (for example, in private repositories).
        with:
          persist-credentials: false

      - name: Detect file changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            actionlint:
              - '.github/workflows/**'
              - '.github/actionlint.yaml'
            php:
              - '**.php'
              - 'composer.*'
            phpcs:
              - '.github/workflows/ci.yml'
              - '.github/workflows/reusable-phpcs-public.yml' # Update this if using private reusable workflow
              - '.phpcs.xml.dist'
            phpstan:
              - '.github/workflows/ci.yml'
              - '.github/workflows/reusable-phpstan-public.yml' # Update this if using private reusable workflow
              - 'phpstan.neon.dist'
            phpunit:
              - '.github/workflows/ci.yml'
              - '.github/workflows/reusable-phpunit-public.yml' # Update this if using private reusable workflow
              - 'tests/**/*.php'
              - 'phpunit.xml.dist'
              - 'package*.json'
              - '.wp-env.test.json'
            js:
              - '.github/workflows/ci.yml'
              - '.github/workflows/reusable-lint-css-js-public.yml' # Update this if using private reusable workflow
              - '.nvmrc'
              - '**.cjs'
              - '**.js'
              - '**.jsx'
              - '**.mjs'
              - '**.cts'
              - '**.mts'
              - '**.ts'
              - '**.tsx'
              - 'package*.json'
              - 'tsconfig*.json'
            css:
              - '**.css'
              - '**.scss'
              - '.editorconfig'
              - '.browserslistrc'
              - '.stylelintignore'
              - 'stylelint.config.mjs'
            e2e:
              - '.github/workflows/ci.yml'
              - '.github/workflows/reusable-e2e-public.yml' # Update this if using private reusable workflow
              - 'tests/e2e/**/*'
              - 'playwright.config.ts'
            jest:
              - '.github/workflows/ci.yml'
              - '.github/workflows/reusable-jest-public.yml' # Update this if using private reusable workflow
              - 'tests/js/**/*'
              - 'src/**/__tests__/**/*'
              - 'src/**/*.test.ts'
              - 'src/**/*.test.tsx'
              - 'src/**/*.spec.ts'
              - 'src/**/*.spec.tsx'
              - 'jest.config.ts'
              - 'package*.json'
              - '.wp-env.test.json'

  actionlint:
    name: actionlint
    needs: detect
    if: needs.detect.outputs.actionlint == 'true'
    uses: ./.github/workflows/reusable-actionlint.yml
    # uses: rtCamp/plugin-skeleton-d/.github/workflows/reusable-actionlint.yml@<version> # Use this in downstream repositories.
    permissions:
      contents: read

  phpcs:
    name: PHPCS
    needs: detect
    if: needs.detect.outputs.php == 'true' || needs.detect.outputs.phpcs == 'true'
    uses: ./.github/workflows/reusable-phpcs-public.yml
    # uses: rtCamp/plugin-skeleton-d/.github/workflows/reusable-phpcs<-public>.yml@<version> # Use this in downstream repositories.
    permissions:
      contents: read
    with:
      php-version: '8.2'

  phpstan:
    name: PHPStan
    needs: detect
    if: needs.detect.outputs.php == 'true' || needs.detect.outputs.phpstan == 'true'
    uses: ./.github/workflows/reusable-phpstan-public.yml
    # uses: rtCamp/plugin-skeleton-d/.github/workflows/reusable-phpstan<-public>.yml@<version> # Use this in downstream repositories.
    permissions:
      contents: read
    with:
      php-version: '8.2'

  lint-css-js:
    name: CSS/JS Lint
    needs: detect
    if: needs.detect.outputs.css == 'true' || needs.detect.outputs.js == 'true'
    uses: ./.github/workflows/reusable-lint-css-js-public.yml
    # uses: rtCamp/plugin-skeleton-d/.github/workflows/reusable-lint-css-js<-public>.yml@<version> # Use this in downstream repositories.
    permissions:
      contents: read

  jest:
    name: Jest Unit Tests
    needs: detect
    if: needs.detect.outputs.js == 'true' || needs.detect.outputs.jest == 'true'
    uses: ./.github/workflows/reusable-jest-public.yml
    # uses: rtCamp/plugin-skeleton-d/.github/workflows/reusable-jest<-public>.yml@<version> # Use this in downstream repositories.
    permissions:
      contents: read
    with:
      coverage: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }}, WP ${{ matrix.wp }})
    needs: [detect, build-plugin-zip]
    if: needs.detect.outputs.php == 'true' || needs.detect.outputs.phpunit == 'true'
    uses: ./.github/workflows/reusable-phpunit-public.yml
    # uses: rtCamp/plugin-skeleton-d/.github/workflows/reusable-phpunit<-public>.yml@<version> # Use this in downstream repositories.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Uncomment this on private runners, which can't run multiple wp-env instances in parallel.
      matrix:
        php: ['8.5', '8.4', '8.3', '8.2']
        wp: ['latest']
        include:
          - php: '8.5'
            wp: 'latest'
            coverage: true
    with:
      php-version: ${{ matrix.php }}
      plugin-slug: plugin-skeleton-d
      wp-version: ${{ matrix.wp }}
      coverage: ${{ matrix.coverage == true }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  e2e:
    name: E2E Tests
    needs: [detect, build-plugin-zip]
    # needs: phpstan
    if: needs.detect.outputs.php == 'true' || needs.detect.outputs.e2e == 'true' || needs.detect.outputs.js == 'true' || needs.detect.outputs.css == 'true'
    uses: ./.github/workflows/reusable-e2e-public.yml
    # uses: rtCamp/plugin-skeleton-d/.github/workflows/reusable-e2e<-public>.yml@<version> # Use this in downstream repositories.
    permissions:
      contents: read
    with:
      php-version: '8.2'
      plugin-slug: plugin-skeleton-d

  build-plugin-zip:
    name: Build Plugin Zip
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-build-public.yml
    # uses: rtCamp/plugin-skeleton-d/.github/workflows/reusable-build<-public>.yml@<version> # Use this in downstream repositories.
    with:
      php-version: '8.2'
      plugin-slug: plugin-skeleton-d
      artifact-name: plugin-skeleton-d-pr${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      # Published by wp-playground-pr-preview.yml once CI succeeds.
      playground-preview: true
