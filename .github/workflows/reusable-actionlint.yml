name: Run actionlint

on:
  workflow_call:

permissions: {}

jobs:
  actionlint:
    name: Lint GitHub Workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # Not updated by Dependabot: bump both together. Checksums: https://github.com/rhysd/actionlint/releases
      ACTIONLINT_VERSION: '1.7.12'
      ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
          persist-credentials: false

      - name: Install actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint

      # shellcheck is preinstalled on GitHub-hosted Ubuntu runners, so `run:` scripts are checked too.
      - name: Run actionlint
        run: |
          # The -format value is a Go template, not a shell expansion.
          # shellcheck disable=SC2016
          "${RUNNER_TEMP}/actionlint" \
            -format '{{range $err := .}}::error file={{$err.Filepath}},line={{$err.Line}},col={{$err.Column}}::{{$err.Message}}%0A```%0A{{replace $err.Snippet "\\n" "%0A"}}%0A```\n{{end}}'
